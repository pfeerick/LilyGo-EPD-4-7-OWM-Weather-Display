name: Lint

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'simulator/**'
      - 'web/**'
      - 'docs/**'
      - 'index.js'
  workflow_call:

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: clang-format

      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            src/*.cpp \
            include/*.h \
            include/translations/*.h \
            simulator/*.cpp \
            simulator/*.h \
            simulator/epdiy_pc/*.c \
            simulator/epdiy_pc/*.h \
            simulator/esp_stubs/*.h \
            simulator/esp_stubs/xtensa/*.h

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: bun

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check
