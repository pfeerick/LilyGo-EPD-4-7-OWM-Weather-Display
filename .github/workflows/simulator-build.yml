name: Simulator Build

on:
  pull_request:
    paths:
      - ".github/workflows/simulator-build.yml"
      - "simulator/**"
      - "src/main.cpp"
      - "include/**"
  workflow_call:

jobs:
  wasm:
    name: WASM (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: python ninja cmake emsdk

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Fetch PlatformIO library deps (headers only)
        run: pio pkg install

      - name: Configure
        run: emcmake cmake -B simulator/build -S simulator -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: emmake cmake --build simulator/build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: simulator-wasm
          path: |
            simulator/wasm/simulator.js
            simulator/wasm/simulator.wasm
